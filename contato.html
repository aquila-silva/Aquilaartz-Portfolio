<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Aquila Fernando Alves Silva" />
    <meta
      name="description"
      content="Entre em contato com Aquila para projetos, colaborações e comissões."
    />
    <meta name="theme-color" content="#f1eee8" />
    <meta property="og:title" content="Contato — Aquilaartz" />
    <meta
      property="og:description"
      content="Entre em contato com Aquila para projetos, colaborações e comissões."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/img/arte-perspec.jpg" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script src="js/main.js" defer></script>
    <link rel="stylesheet" href="css/style.css" />
    <title>Contato — Aquilaartz</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Aquilaartz, início"
        ><span class="brand-mark">A</span><span>Aquilaartz</span></a
      >
      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        <span class="sr-only">Abrir menu</span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Navegação principal">
        <a href="index.html">Trabalhos</a
        ><a class="is-active" href="contato.html">Contato</a>
        <div class="theme-switcher" aria-label="Escolha de tema">
          <button
            class="theme-button"
            type="button"
            data-theme-choice="light"
            aria-label="Usar interface clara"
            aria-pressed="true"
          >
            ☼</button
          ><button
            class="theme-button"
            type="button"
            data-theme-choice="dark"
            aria-label="Usar interface escura"
            aria-pressed="false"
          >
            ☾
          </button>
        </div>
      </nav>
    </header>

    <main class="contact-page section-shell">
      <section class="contact-intro">
        <p class="eyebrow">Contato</p>
        <h1>Vamos criar<br /><em>algo marcante.</em></h1>
        <p>
          Para comissões, colaborações ou apenas para trocar uma ideia sobre
          imagem e processo, escreva.
        </p>
      </section>
      <section class="contact-details" aria-label="Canais de contato">
        <div class="contact-block">
          <span class="detail-label">E-mail</span
          ><a class="contact-link" href="mailto:aquilaartz.contato@gmail.com"
            >aquilaartz.contato@gmail.com <span aria-hidden="true">↗</span></a
          >
        </div>
        <div class="contact-block">
          <span class="detail-label">Redes</span
          ><a
            class="contact-link"
            href="https://github.com/aquila-silva"
            target="_blank"
            rel="noreferrer"
            >GitHub <span aria-hidden="true">↗</span></a
          ><a
            class="contact-link"
            href="https://www.instagram.com/aquilaartz"
            target="_blank"
            rel="noreferrer"
            >Instagram <span aria-hidden="true">↗</span></a
          ><a
            class="contact-link"
            href="https://www.youtube.com/@aquilaartz"
            target="_blank"
            rel="noreferrer"
            >Youtube <span aria-hidden="true">↗</span></a
          >
        </div>
      </section>
    </main>
    <footer class="site-footer section-shell">
      <span>© <span data-current-year></span> Aquilaartz</span
      ><a href="index.html">Ver trabalhos <span aria-hidden="true">↗</span></a>
    </footer>
  </body>
</html>
